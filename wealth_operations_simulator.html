function pHome(){return `${hero('Good afternoon, Operations Analyst','Your client service queues and urgent items for Monday, October 19, 2026.',`<button class="btn primary" data-act="pnav" data-val="cases">Open service cases →</button>`)}<div class="grid4"><div class="card metric"><div class="label">Open tasks in my queues</div><div class="val">${S.taskDone?'2':'3'}</div><div class="extra">Across client service</div></div><div class="card metric critical"><div class="label">Due / urgent items</div><div class="val">2</div><div class="extra">1 reporting discrepancy</div></div><div class="card metric"><div class="label">Open service cases</div><div class="val">1</div><div class="extra">Anderson household</div></div><div class="card metric ok"><div class="label">Active client households</div><div class="val">5</div><div class="extra">${money(HH.reduce((n,h)=>n+h.expected,0))} expected assets</div></div></div><div class="two-up"><section class="card card-pad"><div class="card-head"><div class="card-title">My priority tasks</div><button class="btn sm" data-act="pnav" data-val="tasks">View all tasks</button></div>${taskTable()}</section><section class="card card-pad"><div class="card-head"><div class="card-title">Latest service alert</div>${status(S.caseStatus)}</div><div class="eyebrow">C-2047 · High priority</div><h3 style="font-size:16px;margin:7px 0">Anderson: reported portfolio value does not match CRM</h3><p style="line-height:1.7;color:#66758b">Client Advisory requested an explanation before the household's scheduled quarterly report is distributed. Verify the reporting-group mapping and document the necessary escalation.</p><button class="btn primary" data-act="openCase">Investigate case →</button></section></div><div class="card card-pad"><div class="card-head"><div class="card-title">Recent activity</div><span class="tiny">Synthetic events</span></div><div class="activity"><div class="activity-line"><span class="dot"></span><div><strong>Client Advisory created Case C-2047</strong><div class="tiny">Anderson Family · discrepancy found during report review</div></div></div><div class="activity-line"><span class="dot"></span><div><strong>Reporting data refreshed</strong><div class="tiny">October 19, 2026 · 6:12 AM · source sync does not validate group ownership</div></div></div>${S.activity.slice(0,3).map(a=>`<div class="activity-line"><span class="dot"></span><div><strong>${escapeHtml(a.msg)}</strong><div class="tiny">${a.date}</div></div></div>`).join('')}</div></div>`}
function taskTable(){return `<div class="table-wrap"><table><thead><tr><th>Task</th><th>Client</th><th>Priority</th><th>Status</th></tr></thead><tbody><tr class="hover" data-act="openCase"><td><button class="link-button" data-act="openCase">Review reporting discrepancy</button></td><td>Anderson</td><td>${status('High')}</td><td>${status(S.taskDone?'Completed':'Not started')}</td></tr><tr><td>Validate delayed custodian sync</td><td>Patel</td><td>${status('Medium')}</td><td>${status('Open')}</td></tr><tr><td>Confirm quarter-end report schedule</td><td>Chen</td><td>${status('Normal')}</td><td>${status('Open')}</td></tr></tbody></table></div>`}
function pClients(){const q=S.practifiQuery.toLowerCase().trim();const rows=HH.filter(h=>(h.name+' '+h.advisor+' '+h.contact).toLowerCase().includes(q));return `${hero('Clients & Households','Search client relationships and open their consolidated records.',`<span class="pill">${rows.length} records</span>`)}<div class="card"><div class="table-wrap"><table><thead><tr><th>Household / primary contact</th><th>Advisor</th><th>Tier</th><th>CRM expected AUM</th><th>Linked reporting group</th><th></th></tr></thead><tbody>${rows.map(h=>`<tr class="hover" data-act="client" data-val="${h.id}"><td><button class="link-button" data-act="client" data-val="${h.id}">${h.name}</button><div class="tiny">${h.contact}</div></td><td>${h.advisor}</td><td>${h.tier}</td><td>${money(h.expected)}</td><td class="mono">${h.group}</td><td><button class="btn sm" data-act="client" data-val="${h.id}">Open →</button></td></tr>`).join('')||'<tr><td colspan="6">No matching records.</td></tr>'}</tbody></table></div></div>`}
function pHousehold(){let h=hh(S.selectedHousehold),a=ACC.filter(x=>x.owner===h.id);return `<div class="breadcrumbs"><button data-act="pnav" data-val="clients">Clients</button> / ${h.name}</div>${hero(h.name,`${h.tier} client · Lead advisor: ${h.advisor}`,`<button class="btn" data-act="group" data-val="${h.group}">Open in Tamarac ↗</button><button class="btn primary" data-act="openCase">Service case</button>`)}<div class="grid3"><div class="card metric"><div class="label">CRM expected household AUM</div><div class="val">${money(h.expected)}</div><div class="extra">Preloaded reference value</div></div><div class="card metric"><div class="label">Owned accounts, raw sum</div><div class="val">${money(clientValue(h.id))}</div><div class="extra">Regardless of reporting-group assignment</div></div><div class="card metric ${groupValue(h.group)!==h.expected?'critical':''}"><div class="label">Tamarac reporting group</div><div class="val">${money(groupValue(h.group))}</div><div class="extra">Group ${h.group}</div></div></div><div class="detail-grid"><div class="card card-pad"><div class="card-head"><div class="card-title">Financials · linked asset records</div><span class="pill">${a.length} accounts</span></div><div class="table-wrap"><table><thead><tr><th>Account</th><th>Account number</th><th>Asset value</th><th>Assigned group</th></tr></thead><tbody>${a.map(x=>`<tr><td><button class="link-button" data-act="account" data-val="${x.id}">${x.name}</button></td><td class="mono">${x.id}</td><td>${money(x.value)}</td><td class="mono">${x.group}</td></tr>`).join('')}</tbody></table></div></div><div class="card card-pad"><div class="card-head"><div class="card-title">Relationship details</div></div><dl class="data-dl"><dt>Primary contact</dt><dd>${h.contact}</dd><dt>Email</dt><dd>${h.email}</dd><dt>Advisor</dt><dd>${h.advisor}</dd><dt>Household ID</dt><dd class="mono">${h.id}</dd><dt>Tamarac group</dt><dd class="mono">${h.group}</dd><dt>Onboarding</dt><dd>Active</dd></dl><div class="separator"></div><div class="note">Operations tip: verify both <strong>economic account owner</strong> and <strong>reporting group assignment</strong>. They need not always match in more complex relationships, so confirm intended mapping before changes.</div></div></div>`}
function pTasks(){return `${hero('Processes & Tasks','Client Service · assigned queues and actionable follow-ups')}<div class="grid3"><div class="card metric"><div class="label">All open tasks</div><div class="val">${S.taskDone?'2':'3'}</div></div><div class="card metric"><div class="label">High priority</div><div class="val">${S.taskDone?'0':'1'}</div></div><div class="card metric"><div class="label">Completed today</div><div class="val">${S.taskDone?'1':'0'}</div></div></div><div class="card card-pad">${taskTable()}<div class="separator"></div><div class="note">Task T-084 is considered complete when the mismatch has been investigated, correctly escalated, and report distribution is safeguarded. The underlying master-data correction requires authorized review.</div><div style="margin-top:15px"><button class="btn ${S.taskDone?'':'primary'}" data-act="toggleTask">${S.taskDone?'Reopen':'Mark complete'} · T-084</button></div></div>`}
function pCases(){return `${hero('Service Cases','Track inbound client-service issues, routing and resolution status.')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Case</th><th>Subject</th><th>Household</th><th>Priority</th><th>Owner / queue</th><th>Status</th></tr></thead><tbody><tr class="hover" data-act="openCase"><td><button class="link-button" data-act="openCase">C-2047</button></td><td>Quarter-end reporting AUM discrepancy</td><td>Anderson Family</td><td>${status('High')}</td><td>${escapeHtml(S.assignedQueue)}</td><td>${status(S.caseStatus)}</td></tr></tbody></table></div></div>`}
function pCase(){return `<div class="breadcrumbs"><button data-act="pnav" data-val="cases">Service Cases</button> / C-2047</div>${hero('C-2047 · Reporting value discrepancy','Anderson Family · Opened Oct 19, 2026 · Due Oct 20, 2026',`<button class="btn" data-act="client" data-val="H-101">View household</button><button class="btn" data-act="group" data-val="G-101">View Tamarac group ↗</button>`)}<div class="detail-grid"><div class="card card-pad"><div class="card-head"><div class="card-title">Case investigation and routing</div>${status('High priority')}</div><div class="warnbox" style="margin-bottom:20px"><strong>Client Advisory request:</strong> CRM lists Anderson Family's expected managed assets as ${money(2200000)}, but the current Tamarac reporting group displays ${money(1850000)}. The report is scheduled to go out tomorrow. Determine why, ensure potentially affected reports are paused, and route a correction for review. Do not directly alter custodian data.</div><div class="fieldrow"><div class="field"><label for="caseCause">Investigated root cause</label><select id="caseCause"><option value="">Select a finding...</option><option value="Incorrect reporting-group assignment" ${S.cause==='Incorrect reporting-group assignment'?'selected':''}>Incorrect reporting-group assignment</option><option value="Missing custodial feed" ${S.cause==='Missing custodial feed'?'selected':''}>Missing custodial feed</option><option value="Market-value movement" ${S.cause==='Market-value movement'?'selected':''}>Market-value movement</option><option value="Duplicate transactions" ${S.cause==='Duplicate transactions'?'selected':''}>Duplicate transactions</option></select></div><div class="field"><label for="caseAccount">Affected account</label><select id="caseAccount"><option value="">Select affected account...</option>${ACC.map(a=>`<option value="${a.id}" ${S.affected===a.id?'selected':''}>${a.id} · ${a.name}</option>`).join('')}</select></div></div><div class="fieldrow"><div class="field"><label for="caseQueue">Assign to queue</label><select id="caseQueue">${['Client Service','Reporting Operations','Investment Team','Accounting','Compliance'].map(x=>`<option ${S.assignedQueue===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="caseStatus">Case status</label><select id="caseStatus">${['Open','Investigating','Escalated – Pending Review','Resolved'].map(x=>`<option ${S.caseStatus===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label for="caseNotes">Investigation notes (write professional, concise findings)</label><textarea id="caseNotes" placeholder="Document what you compared, variance, root cause, affected groups, report hold, requested corrective action and required review.">${escapeHtml(S.caseNotes)}</textarea><div class="helptext">Suggested format: Evidence → impact → proposed next action → owner or review path.</div></div><div class="toolbar"><button class="btn primary" data-act="saveCase">Save case updates</button><button class="btn" data-act="exportCase">Download case summary</button></div></div><aside><div class="card card-pad" style="margin-bottom:17px"><div class="card-head"><div class="card-title">Case snapshot</div></div><dl class="data-dl"><dt>Household</dt><dd>Anderson Family</dd><dt>CRM AUM</dt><dd>${money(2200000)}</dd><dt>Reporting AUM</dt><dd>${money(groupValue('G-101'))}</dd><dt>Difference</dt><dd class="diff" style="font-size:17px">${money(2200000-groupValue('G-101'))}</dd><dt>Assigned queue</dt><dd>${escapeHtml(S.assignedQueue)}</dd><dt>Status</dt><dd>${status(S.caseStatus)}</dd></dl></div><div class="card card-pad"><div class="card-head"><div class="card-title">Related items</div></div><p><button class="link-button" data-act="client" data-val="H-101">Anderson Family · Client profile ↗</button></p><p><button class="link-button" data-act="group" data-val="G-101">G-101 · Anderson reporting group ↗</button></p><p><button class="link-button" data-act="group" data-val="G-102">G-102 · Bennett reporting group ↗</button></p><p><button class="link-button" data-act="account" data-val="A-1003">A-1003 · Anderson Family Trust ↗</button></p></div></aside></div>`}
function tamarac(){return `<div><div class="tamarac-bar"><div class="tamarac-logo"><b>▤</b> TAMARAC <span class="tiny" style="font-weight:500">| Reporting · simulated</span></div><nav class="t-nav">${[['dashboard','Dashboard'],['accounts','Accounts'],['groups','Groups'],['performance','Performance'],['reports','Report Studio'],['recon','Reconciliation']].map(([id,n])=>`<button class="${S.tamaracPage===id?'active':''}" data-act="tnav" data-val="${id}">${n}</button>`).join('')}</nav><div class="pill">Data as of Oct 19, 2026</div></div><main class="tamarac-main">${S.tamaracPage==='dashboard'?tDashboard():S.tamaracPage==='accounts'?tAccounts():S.tamaracPage==='account'?tAccount():S.tamaracPage==='groups'?tGroups():S.tamaracPage==='performance'?tPerformance():S.tamaracPage==='reports'?tReports():S.tamaracPage==='recon'?tRecon():tDashboard()}</main></div>`}
function groupFilter(){return `<div class="card t-filter"><label for="gSelector">SHOW DATA FOR</label><select id="gSelector">${HH.map(h=>`<option value="${h.group}" ${S.selectedGroup===h.group?'selected':''}>${h.name} · ${h.group}</option>`).join('')}</select><span class="tiny">Switch reporting group for dashboard and performance analysis.</span></div>`}
function tDashboard(){let g=S.selectedGroup,h=groupHH(g),val=groupValue(g),v=h.expected;let accounts=ACC.filter(a=>a.group===g);return `${hero('Reporting Dashboard','Account values, holdings and operating checks at a glance.',`<button class="btn" data-act="tnav" data-val="reports">Review report packets</button>`)}${groupFilter()}<div class="grid4"><div class="card metric"><div class="label">Current managed market value</div><div class="val">${money(val)}</div><div class="extra">Reporting group ${g}</div></div><div class="card metric"><div class="label">YTD return (illustrative)</div><div class="val">+${accounts.length?(accounts.reduce((s,a)=>s+a.value*a.returnYtd,0)/val).toFixed(2):'0.00'}%</div><div class="extra">Weighted account display; mock only</div></div><div class="card metric ${val!==v?'critical':'ok'}"><div class="label">Variance vs CRM expected AUM</div><div class="val">${money(val-v)}</div><div class="extra">${val!==v?'Requires investigation':'Matches household expectation'}</div></div><div class="card metric"><div class="label">Account members</div><div class="val">${accounts.length}</div><div class="extra">Group ${g} in this simulation</div></div></div><div class="grid2"><div class="card card-pad"><div class="card-head"><div class="card-title">Account Performance · illustrative trend</div><span class="tiny">YTD</span></div>${sparkline(val)}<div class="toolbar" style="margin-top:10px"><span class="pill green">+6.5% portfolio trend illustration</span><button class="btn sm" data-act="tnav" data-val="performance">See performance detail</button></div></div><div class="card card-pad"><div class="card-head"><div class="card-title">Asset allocation · visual example</div><span class="tiny">Illustrative</span></div><div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap"><div class="donut"><div class="donut-center"><span>Market value</span><b>${money(val)}</b></div></div><div class="legend"><div><span style="background:#2b679b"></span> Equities 48%</div><div><span style="background:#2bb3a5"></span> Fixed income 26%</div><div><span style="background:#f1b65a"></span> Multi-asset 15%</div><div><span style="background:#758db9"></span> Alternatives 7%</div><div><span style="background:#d8e1eb"></span> Cash 4%</div></div></div></div></div><div class="card"><div class="card-pad"><div class="card-head"><div class="card-title">Account group membership · ${h.name}</div><button class="btn sm" data-act="tnav" data-val="accounts">All accounts</button></div></div>${tAccountTable(accounts)}</div><div class="note" style="margin-top:16px">Market values and the group membership table are the investigative data for this exercise. Performance and allocation charts are visual examples, not reconciled portfolio analytics.</div>`}
function sparkline(val){let y=[77,73,75,69,67,59,62,54,53,46,43,46,40,35,36,29,30,22,24,17];let pts=y.map((v,i)=>`${(i/19)*600},${v}`).join(' ');return `<svg class="spark" viewBox="0 0 600 100" preserveAspectRatio="none" aria-label="Illustrative upward performance trend"><defs><linearGradient id="area-grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#8ad8d0" stop-opacity=".40"/><stop offset="100%" stop-color="#8ad8d0" stop-opacity="0"/></linearGradient></defs><line x1="0" y1="77" x2="600" y2="77" stroke="#e4ebf3" stroke-dasharray="4 5"/><line x1="0" y1="40" x2="600" y2="40" stroke="#e4ebf3" stroke-dasharray="4 5"/><polygon points="0,100 ${pts} 600,100" fill="url(#area-grad)"/><polyline points="${pts}" fill="none" stroke="#209d99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="split-inline tiny"><span>Jan 2026</span><span>Apr</span><span>Jul</span><span>Oct 2026</span></div>`}
function tAccountTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Account</th><th>Owner household</th><th>Assigned group</th><th>Custodian</th><th>Recon</th><th class="num">Market value</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr class="hover" data-act="account" data-val="${a.id}"><td><button class="link-button" data-act="account" data-val="${a.id}">${a.name}</button><div class="tiny mono">${a.id}</div></td><td>${hh(a.owner).name}</td><td class="mono">${a.group}</td><td>${a.custodian}</td><td>${status(a.sync)}</td><td class="num">${money(a.value)}</td><td><button class="btn sm" data-act="account" data-val="${a.id}">Details</button></td></tr>`).join('')||'<tr><td colspan="7">No accounts match this filter.</td></tr>'}</tbody></table></div>`}
function tAccounts(){const q=S.tamaracQuery.toLowerCase().trim();let rows=ACC.filter(a=>(a.id+' '+a.name+' '+hh(a.owner).name+' '+a.group+' '+a.custodian).toLowerCase().includes(q));return `${hero('Accounts','Explore account ownership, reporting groups, market values and reconciliation status.',`<button class="btn" data-act="export">Export bulk account report ↓</button>`)}<div class="card card-pad" style="margin-bottom:17px"><div class="split-inline"><div class="toolbar"><label for="accountFilter" class="tiny">Search account lists:</label><input class="search" id="accountFilter" placeholder="Account, family, group or custodian" value="${escapeHtml(S.tamaracQuery)}"/></div><span class="pill">${rows.length} of ${ACC.length} accounts</span></div></div><div class="card">${tAccountTable(rows)}</div><div class="note" style="margin-top:17px">An account can be successfully reconciled to its custodian and still belong to the wrong <strong>reporting group</strong>. These checks test different things.</div>`}
function tAccount(){let a=acc(S.selectedAccount),h=hh(a.owner),assigned=groupHH(a.group);return `<div class="breadcrumbs"><button data-act="tnav" data-val="accounts">Accounts</button> / ${a.id}</div>${hero(a.name,`Account ${a.id} · Custodian ${a.custodian}`,`<button class="btn" data-act="client" data-val="${h.id}">Open CRM household ↗</button><button class="btn" data-act="group" data-val="${a.group}">Open reporting group</button>`)}<div class="grid3"><div class="card metric"><div class="label">Current market value</div><div class="val">${money(a.value)}</div></div><div class="card metric"><div class="label">Custodian reconciliation</div><div style="margin:15px 0 10px">${status(a.sync)}</div><div class="extra">${a.lastSync}</div></div><div class="card metric"><div class="label">Reporting group</div><div class="val mono">${a.group}</div><div class="extra">${assigned.name}</div></div></div><div class="detail-grid"><div class="card card-pad"><div class="card-head"><div class="card-title">Account information</div></div><dl class="data-dl"><dt>Account number</dt><dd>${a.id}</dd><dt>Legal owner</dt><dd>${h.name}</dd><dt>Owner household ID</dt><dd class="mono">${a.owner}</dd><dt>Assigned group</dt><dd>${assigned.name} · ${a.group}</dd><dt>Expected group</dt><dd>${h.name} · ${h.group}</dd><dt>Custodian</dt><dd>${a.custodian}</dd><dt>Account market value</dt><dd>${money(a.value)}</dd><dt>YTD return</dt><dd>${a.returnYtd.toFixed(1)}% · illustrative</dd></dl></div><div class="card card-pad"><div class="card-head"><div class="card-title">Operational validation</div></div>${a.group!==h.group?'<div class="warnbox"><strong>Possible group mismatch.</strong> The linked household ownership and assigned reporting group differ. Confirm intended account association before requesting any configuration changes.</div>':'<div class="greenbox"><strong>Account mapping consistent.</strong> Owner and assigned group match in this simplified training dataset.</div>'}<div style="margin-top:17px" class="note"><strong>Good practice:</strong> Do not edit account master data or reporting-group relationships without appropriate authorization, audit trail, and second-person review.</div></div></div>`}
function tGroups(){return `${hero('Groups & Households','A reporting group determines which accounts appear together in consolidated reporting.',`<button class="btn" data-act="export">Export account mapping ↓</button>`)}<div class="card"><div class="table-wrap"><table><thead><tr><th>Reporting group</th><th>Household</th><th>Account count</th><th class="num">Reported value</th><th class="num">CRM expected value</th><th>Review state</th></tr></thead><tbody>${HH.map(h=>`<tr class="hover" data-act="group" data-val="${h.group}"><td><button class="link-button" data-act="group" data-val="${h.group}">${h.group}</button></td><td>${h.name}</td><td>${ACC.filter(a=>a.group===h.group).length}</td><td class="num">${money(groupValue(h.group))}</td><td class="num">${money(h.expected)}</td><td>${groupValue(h.group)!==h.expected?status('Mismatch'):status('Matches')}</td></tr>`).join('')}</tbody></table></div></div>`}
function tPerformance(){let h=groupHH(S.selectedGroup),arr=ACC.filter(a=>a.group===h.group),v=groupValue(h.group);return `${hero('Account Performance','Dynamic report example: account values and illustrative year-to-date returns.')}${groupFilter()}<div class="grid2"><div class="card card-pad"><div class="card-title" style="margin-bottom:17px">Performance timeline</div>${sparkline(v)}</div><div class="card metric"><div class="label">Reported market value</div><div class="val">${money(v)}</div><div class="extra">${h.name}, ${h.group} · as of Oct 19, 2026</div><div class="separator"></div><span class="pill amber">Historical-return chart is fictional</span></div></div><div class="card">${tAccountTable(arr)}</div>`}
function tReports(){let h=groupHH(S.selectedGroup);return `${hero('Report Studio · Quarterly Client Packs','Queue, review and safeguard client-facing report distribution.',`<button class="btn" data-act="export">Export underlying account CSV ↓</button>`)}<div class="note" style="margin-bottom:15px">Practice control: <strong>Hold</strong> represents an internal distribution hold, not an actual Tamarac-specific workflow. Do not release reports until account-group mapping and affected balances have been reviewed.</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Client / reporting group</th><th>Report type</th><th>As of</th><th class="num">Report value</th><th>Status</th><th>Action</th></tr></thead><tbody>${HH.map(h=>{let hold=!!S.reportHolds[h.group];return `<tr><td><strong>${h.name}</strong><div class="tiny mono">${h.group}</div></td><td>Quarterly client packet</td><td>Oct 19, 2026</td><td class="num">${money(groupValue(h.group))}</td><td>${status(hold?'On hold':'Ready for review')}</td><td><button class="btn sm ${hold?'':'warn'}" data-act="toggleHold" data-val="${h.group}">${hold?'Remove hold':'Place hold'}</button></td></tr>`}).join('')}</tbody></table></div></div><div class="grid2" style="margin-top:17px"><div class="card card-pad"><div class="card-head"><div class="card-title">Hold justification</div></div><div class="field"><label for="holdGroup">Report group</label><select id="holdGroup">${HH.map(x=>`<option value="${x.group}" ${S.selectedGroup===x.group?'selected':''}>${x.name} · ${x.group}</option>`).join('')}</select></div><div class="field"><label for="holdReason">Internal distribution note</label><textarea id="holdReason" placeholder="Describe the reason for the hold and what would be required before release.">${escapeHtml(S.holdNotes[S.selectedGroup]||'')}</textarea></div><button class="btn primary" data-act="saveHold">Save note for selected group</button></div><div class="card card-pad"><div class="card-head"><div class="card-title">Selected report packet</div></div><dl class="data-dl"><dt>Household</dt><dd>${h.name}</dd><dt>Group</dt><dd class="mono">${h.group}</dd><dt>Report total</dt><dd>${money(groupValue(h.group))}</dd><dt>Distribution</dt><dd>${status(S.reportHolds[h.group]?'On hold':'Ready for review')}</dd><dt>Hold note</dt><dd>${escapeHtml(S.holdNotes[h.group]||'Not documented')}</dd></dl></div></div>`}
function tRecon(){let stale=ACC.filter(a=>a.sync!=='Reconciled');return `${hero('Reconciliation Workbench','Daily data freshness and account validation checks.',`<button class="btn" data-act="export">Export reconciliation CSV ↓</button>`)}<div class="grid3"><div class="card metric"><div class="label">Accounts reconciled</div><div class="val">8 / 9</div><div class="extra">Custodial balances verified as of listed timestamps</div></div><div class="card metric critical"><div class="label">Stale sync records</div><div class="val">${stale.length}</div><div class="extra">Potentially require custodian follow-up</div></div><div class="card metric critical"><div class="label">Owner / group exceptions</div><div class="val">${ACC.filter(a=>hh(a.owner).group!==a.group).length}</div><div class="extra">Different from custodian recon exceptions</div></div></div><div class="card card-pad"><div class="card-head"><div class="card-title">Operational exceptions</div></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Exception type</th><th>Last update</th><th>Suggested follow-up</th></tr></thead><tbody><tr><td><button class="link-button" data-act="account" data-val="A-1009">A-1009 · Patel Rollover IRA</button></td><td>${status('Stale custodian data')}</td><td>Oct 16, 2026</td><td>Verify feed timing and confirm values before issuance</td></tr><tr><td><button class="link-button" data-act="account" data-val="A-1003">A-1003 · Anderson Family Trust</button></td><td>${status('Reporting group mismatch')}</td><td>Oct 19, 2026</td><td>Verify account-owner mapping; escalate for approval</td></tr></tbody></table></div></div><div class="warnbox" style="margin-top:17px"><strong>Bonus challenge:</strong> A reconciled account may have incorrect group membership, while a properly grouped account can have stale custodian data. Distinguish these issues in your final summary.</div>`}
function assessments(){const checks=[
{label:'Choose the correct underlying issue',pass:S.cause==='Incorrect reporting-group assignment',tip:'Case C-2047 should document the underlying mapping issue.'},
{label:'Identify the affected account',pass:S.affected==='A-1003',tip:'Find the account with inconsistent owner and reporting group.'},
{label:'Route for Reporting Operations review',pass:S.assignedQueue==='Reporting Operations'&&S.caseStatus==='Escalated – Pending Review',tip:'Keep the case pending approved correction, not resolved.'},
{label:'Write a substantive investigation note',pass:S.caseNotes.trim().length>=60,tip:'Record evidence, business impact, and next action (at least 60 characters).'},
{label:'Place Anderson report on hold',pass:!!S.reportHolds['G-101'],tip:'Group G-101 should not be released yet.'},
{label:'Place Bennett report on hold',pass:!!S.reportHolds['G-102'],tip:'The incorrect assignment also impacts the receiving group.'},
{label:'Document the report holds',pass:(S.holdNotes['G-101']||'').trim().length>=15&&(S.holdNotes['G-102']||'').trim().length>=15,tip:'Add a clear internal note to each affected packet.'},
{label:'Complete investigation task T-084',pass:S.taskDone,tip:'After documenting and escalating the issue, close only the investigation task.'}];return checks}
function assignment(){const checks=assessments(),n=checks.filter(x=>x.pass).length;return `<div class="assignment"><div class="assignment-hero"><div><div class="eyebrow" style="color:#77d8cf">Operations Analyst · Realistic case study</div><h1>Assignment 01: Quarter-End Reporting Exception</h1><p>You are supporting a fictional Seattle wealth-management firm. Client Advisory is preparing quarterly statements when the CRM's expected household value fails to match the account reporting group. Investigate across Practifi and Tamarac, preserve reporting quality, and escalate the correct fix.</p><div class="toolbar" style="margin-top:16px"><span class="pill">45–60 minutes</span><span class="pill">Intermediate beginner</span><span class="pill">No financial data is real</span></div></div><div><button class="btn teal" data-act="openCase">Start investigation →</button></div></div><div class="grid3"><div class="card metric"><div class="label">Business request</div><div class="val" style="font-size:18px">Protect client reports</div><div class="extra">Avoid distributing incorrect consolidated values</div></div><div class="card metric"><div class="label">Systems involved</div><div class="val" style="font-size:18px">2 platforms</div><div class="extra">Practifi (workflow) + Tamarac (accounts/reporting)</div></div><div class="card metric"><div class="label">Evaluation</div><div class="val">${n} / ${checks.length}</div><div class="extra">Practice checks currently satisfied</div></div></div><div class="grid2"><div class="card card-pad"><div class="card-head"><div class="card-title">Your assignment · action sequence</div><span class="pill">8 checks</span></div>${[
['Review the client-service case','Open Case C-2047 and note the CRM expected value, reported value and the time-sensitive business request.'],
['Trace the reported balance','In Tamarac, review reporting groups and Accounts. Compare the household owner to the group assignment for each potentially relevant account.'],
['Document root cause and affected record','Return to Practifi; select the correct issue type and account number. Write a specific evidence-based investigation note.'],
['Escalate the correct operational work','Assign the case to Reporting Operations and change the case status to Escalated – Pending Review. Do not claim the data correction itself is complete.'],
['Protect affected client reporting','Use Tamarac Report Studio to place both affected report packets on hold. Save a justification for each group.'],
['Close only the investigation task','Mark T-084 completed in Practifi after the case and distribution controls are in place.'],
['Run the quality checker','Return here and click Check my work. Download a case summary and account CSV if you want a record of your practice.']
].map(([t,d],i)=>`<div class="step"><div class="step-num">${i+1}</div><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}<div class="toolbar" style="margin-top:15px"><button class="btn primary" data-act="platform" data-val="practifi">Open Practifi CRM →</button><button class="btn" data-act="platform" data-val="tamarac">Open Tamarac →</button></div></div><div><div class="card card-pad" style="margin-bottom:17px"><div class="card-head"><div class="card-title">Assessment & feedback</div><span class="pill ${n===checks.length?'green':'blue'}">${n} of ${checks.length}</span></div><div class="progress"><div style="width:${100*n/checks.length}%"></div></div><p class="helptext">The score updates as you work. Press “Check my work” to see the results. The checker evaluates workflow and safeguards, not whether your written notes are factually perfect.</p><div class="toolbar"><button class="btn primary" data-act="check">Check my work</button><button class="btn" data-act="downloadWorksheet">Download assignment brief</button></div>${S.gradeShown?`<div style="margin-top:15px">${checks.map(x=>`<div class="grade-row"><div><strong>${x.label}</strong><div class="tiny">${x.pass?'Requirement satisfied':x.tip}</div></div><span class="grade ${x.pass?'good':'bad'}">${x.pass?'Pass':'To do'}</span></div>`).join('')}</div>`:''}</div><div class="card card-pad"><div class="card-head"><div class="card-title">Deliverables a real manager may expect</div></div><div class="activity"><div class="activity-line"><span class="dot"></span><div><strong>Variance and root-cause note</strong><div class="tiny">Which account, why total is wrong, amount and source evidence</div></div></div><div class="activity-line"><span class="dot"></span><div><strong>Case routed with clear accountability</strong><div class="tiny">Evidence, requested fix, approval state, impact and priority</div></div></div><div class="activity-line"><span class="dot"></span><div><strong>Client-report distribution safeguards</strong><div class="tiny">Prevent affected households from receiving an unverified report</div></div></div><div class="activity-line"><span class="dot"></span><div><strong>Follow-up control</strong><div class="tiny">Verification after change and release only after review</div></div></div></div><div class="separator"></div><button class="btn sm" data-act="showSolution">${S.showSolution?'Hide':'Reveal'} instructor solution</button>${S.showSolution?`<div class="warnbox" style="margin-top:15px"><strong>Instructor key · spoiler</strong><p>The Anderson Family Trust, <span class="mono">A-1003</span>, has ${money(350000)} and belongs to household H-101, but is assigned to Bennett reporting group G-102 instead of Anderson reporting group G-101. Anderson consequently appears ${money(350000)} low (${money(1850000)} vs ${money(2200000)}), while Bennett appears ${money(350000)} high (${money(2130000)} vs ${money(1780000)}). Escalate a controlled group-membership review, hold both client report packets, then revalidate both groups after authorized correction. Do not treat a reconciled custodian balance as proof of correct client attribution.</p><p><strong>Bonus:</strong> Patel account A-1009 has an older custodian synchronization timestamp and merits a separate feed-freshness review.</p></div>`:''}</div></div></div><div class="card card-pad"><div class="card-head"><div class="card-title">About this simulator</div></div><p style="color:#65758b;line-height:1.7;margin:0">This is a locally running practice app created for interview preparation. It deliberately imitates common <strong>workflows and information architecture</strong>, not an exact proprietary product skin. The Practifi-to-Tamarac integration, custom dashboards, approval processes, menus and permissions differ among firms. In particular, holding a report here is a training control rather than a statement about the product's native report-delivery controls. It stores your progress in this browser only.</p></div></div>`}
function csvQuote(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadText(filename,content,type='text/plain;charset=utf-8'){let blob=new Blob([content],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportAccounts(){let fields=['account_id','account_name','owner_household','expected_group','actual_reporting_group','value_usd','custodian','sync_status','last_sync'];let data=[fields.join(','),...ACC.map(a=>[a.id,a.name,hh(a.owner).name,hh(a.owner).group,a.group,a.value,a.custodian,a.sync,a.lastSync].map(csvQuote).join(','))].join('\r\n');S.exported=true;save();downloadText('tamarac_practice_accounts.csv',data,'text/csv;charset=utf-8');toast('Sample account CSV exported.');}
function exportCase(){let d=`PRACTICE CASE C-2047 | Oct 19, 2026\nHousehold: Anderson Family\nCRM expected AUM: ${money(2200000)}\nReported group AUM: ${money(groupValue('G-101'))}\nVariance: ${money(2200000-groupValue('G-101'))}\nRoot cause: ${S.cause||'Not selected'}\nAffected account: ${S.affected||'Not selected'}\nQueue: ${S.assignedQueue}\nStatus: ${S.caseStatus}\nNotes:\n${S.caseNotes||'(none)'}\n\nReport distribution controls:\n${HH.map(h=>`${h.name}: ${S.reportHolds[h.group]?'ON HOLD':'Ready for review'}; note: ${S.holdNotes[h.group]||'(none)'}`).join('\n')}\n\nThis document is part of a fictional practice simulator.\n`;downloadText('case_C-2047_practice_summary.txt',d);toast('Practice case summary downloaded.');}
function assignmentText(){return `OPERATIONS ANALYST PRACTICE ASSIGNMENT\n\nCASE: Quarter-End Reporting Exception | C-2047\nTIME: 45–60 minutes\n\nScenario: Client Advisory sees a mismatch between Practifi's Anderson Family expected AUM and its Tamarac Reporting group value. Investigate the discrepancy, document your evidence, select the affected account, route a correction for review, protect affected client report packets, and complete the investigation task.\n\nSTEPS\n1. Open Practifi Service Cases and Case C-2047.\n2. Use Tamarac Groups, Accounts and Reconciliation to inspect account ownership and group membership.\n3. Record root cause, affected account, queue, status, and an evidence-based note in Practifi.\n4. In Tamarac Report Studio, put all affected reports on hold and write hold justifications.\n5. Complete Practifi Task T-084 after safeguarding distribution and escalation.\n6. Return to Assignment and check your work.\n\nDELIVERABLES\n- Written issue investigation\n- Properly routed CRM case\n- Safe report distribution controls\n- Recommended authorized remediation and validation\n\nBonus: Identify a separate data-freshness exception.\n\nThis is an entirely fictional local practice environment, not a real Tamarac or Practifi deployment.\n`;downloadText('operations_analyst_practice_assignment.txt',assignmentText);}
function readCaseForm(){let fields=[['caseCause','cause'],['caseAccount','affected'],['caseQueue','assignedQueue'],['caseStatus','caseStatus'],['caseNotes','caseNotes']];fields.forEach(([id,key])=>{const el=byId(id);if(el)S[key]=el.value;});}
function render(){byId('app').innerHTML=shell();attachSearch()}
function attachSearch(){let el=byId('globalPsearch');if(el)el.addEventListener('input',e=>{S.practifiQuery=e.target.value;save();if(S.practifiPage==='clients'){let p=e.target.selectionStart;render();let r=byId('globalPsearch');if(r){r.focus();r.setSelectionRange(p,p)}}});let f=byId('accountFilter');if(f)f.addEventListener('input',e=>{let pos=e.target.selectionStart;S.tamaracQuery=e.target.value;save();render();let r=byId('accountFilter');if(r){r.focus();r.setSelectionRange(pos,pos)}})}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-act]');if(!btn)return;let act=btn.dataset.act,val=btn.dataset.val;switch(act){
case 'platform':page(val);break;case 'pnav':page('practifi',val);break;case 'tnav':page('tamarac',val);break;case 'client':clientSelect(val);break;case 'account':accountSelect(val);break;case 'group':groupSelect(val);break;case 'openCase':page('practifi','case');break;
case 'toggleTask':S.taskDone=!S.taskDone;log(`Task T-084 ${S.taskDone?'completed':'reopened'}`);save();render();toast('Training task status updated.');break;
case 'saveCase':readCaseForm();log(`Case C-2047 saved (${S.caseStatus})`);save();render();toast('Case saved in local practice data.');break;
case 'toggleHold':S.reportHolds[val]=!S.reportHolds[val];S.selectedGroup=val;log(`${val} report ${S.reportHolds[val]?'placed on hold':'released to review'}`);save();render();toast(`${val} ${S.reportHolds[val]?'placed on hold':'hold removed'}.`);break;
case 'saveHold':{let g=byId('holdGroup');let n=byId('holdReason');if(g&&n){S.holdNotes[g.value]=n.value;S.selectedGroup=g.value;log(`Updated ${g.value} report note`);save();render();toast('Report hold justification saved.')}break;}
case 'export':exportAccounts();break;case 'exportCase':readCaseForm();save();exportCase();break;case 'downloadWorksheet':assignmentText();break;
case 'check':S.gradeShown=true;save();render();toast(`${assessments().filter(x=>x.pass).length}/${assessments().length} workflow checks passed.`);break;
case 'showSolution':S.showSolution=!S.showSolution;save();render();break;
case 'reset':if(confirm('Reset all simulated cases, report holds, and practice progress?')){S={...INITIAL,reportHolds:{...INITIAL.reportHolds},holdNotes:{},activity:[]};save();render();toast('Practice environment reset.')}break;
}});
document.addEventListener('change',e=>{if(e.target.id==='gSelector'){S.selectedGroup=e.target.value;save();render()}if(e.target.id==='holdGroup'){S.selectedGroup=e.target.value;save();render()}});
render();
</script>
</body>
</html>
